<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LexÁgile</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Sora:wght@100..800&display=swap">
  <!-- Aplica o tema salvo antes do primeiro desenho (sem piscar o claro) -->
  <script>
    try {
      var t = localStorage.getItem('stars.theme');
      document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
