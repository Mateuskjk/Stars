<section class="invite__card">
  @if (welcome(); as name) {
    <span class="invite__icon invite__icon--ok" aria-hidden="true">✓</span>
    <h2 class="invite__title">Conta ativada! Bem-vindo(a), {{ name }}.</h2>
    <p class="invite__text">Sua senha foi criada e o seu acesso ao LexÁgile já está liberado.</p>
    <button class="modal__primary invite__button" type="button" (click)="enter()">Entrar no LexÁgile</button>
  } @else {
    <span class="invite__icon" aria-hidden="true">✉️</span>
    <h2 class="invite__title">Ativar convite</h2>
    <p class="invite__text">Informe o e-mail que recebeu o convite, o código de 6 números enviado para ele e crie a sua senha.</p>

    <form class="invite__form" (submit)="submit($event)">
      <label class="modal__field">
        <span class="modal__label">E-mail</span>
        <input class="modal__input" name="email" type="email" required autocomplete="email" [value]="email" />
      </label>
      <label class="modal__field">
        <span class="modal__label">Código de verificação</span>
        <input
          #code
          class="modal__input invite__code"
          name="code"
          required
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          pattern="\d{6}"
          placeholder="000000"
          aria-describedby="invite-error"
          (input)="onlyDigits(code)"
        />
      </label>
      <label class="modal__field">
        <span class="modal__label">Crie uma senha <span class="modal__optional">(mínimo 8 caracteres)</span></span>
        <input class="modal__input" name="password" type="password" required minlength="8" autocomplete="new-password" />
      </label>
      <label class="modal__field">
        <span class="modal__label">Repita a senha</span>
        <input class="modal__input" name="confirm" type="password" required minlength="8" autocomplete="new-password" />
      </label>
      <p id="invite-error" class="planning__error" role="alert">{{ error() }}</p>
      <button class="modal__primary invite__button" type="submit" [disabled]="sending()">
        {{ sending() ? 'Ativando…' : 'Ativar conta e entrar' }}
      </button>
    </form>
  }
</section>
