<header class="backlog__header">
  <div>
    <h2 class="backlog__title">Backlog</h2>
    <p class="backlog__subtitle">Atividades gerais do time (não vinculadas a projetos)</p>
  </div>
  <button class="backlog__new" type="button" (click)="openNew()">+ Nova atividade</button>
</header>

<!-- Quadro -->
<div class="backlog__board">
  @for (column of board(); track column.id) {
    <section
      class="backlog__column"
      [class.is-drop-target]="dropTarget() === column.id"
      [attr.aria-label]="column.label"
      (dragover)="onDragOver($event, column.id)"
      (drop)="onDrop($event, column.id)"
    >
      <header class="backlog__column-header">
        <span class="backlog__dot" [style.background]="column.color"></span>
        <app-column-title
          class="backlog__column-title"
          [label]="column.label"
          [custom]="isCustom(column.id)"
          [count]="column.cards.length"
          [fallback]="columns()[0].label"
          (rename)="renameColumn(column.id, $event)"
          (remove)="removeColumn(column.id)"
        />
        <span class="backlog__count">{{ column.cards.length }}</span>
      </header>

      <ul class="backlog__cards">
        @for (card of column.cards; track card.id) {
          <li
            class="backlog-card"
            [class.is-locked]="card.locked"
            [class.is-dragging]="dragging() === card.id"
            [attr.draggable]="!card.locked"
            (dragstart)="dragging.set(card.id)"
            (dragend)="endDrag()"
          >
            <button class="backlog-card__open" type="button" (click)="openEdit(card)">
              @if (card.tags.length) {
                <span class="backlog-card__tags">
                  @for (tag of card.tags; track tag) {
                    <span class="tag" [style.--tag-color]="tagColor(tag)">{{ tag }}</span>
                  }
                </span>
              }
              <span class="backlog-card__name">{{ card.name }}</span>
              <span class="backlog-card__meta">
                @if (sprintOf(card); as sprint) {
                  <span class="backlog-card__sprint" [class.is-active]="sprint.status === 'active'" [title]="sprint.status === 'active' ? 'Na sprint ativa' : 'Sprint ' + sprint.status">{{ sprint.name }}</span>
                }
                @if (card.due) {
                  <span class="backlog-card__due" [class.is-overdue]="isOverdue(card)">
                    {{ isOverdue(card) ? 'Atrasado · ' : '' }}{{ formatDue(card.due) }}
                  </span>
                }
                @if (card.subtasks.length) {
                  <span title="Sub atividades">☑ {{ doneSubtasks(card) }}/{{ card.subtasks.length }}</span>
                }
                @if (card.comments.length) {
                  <span title="Comentários">💬 {{ card.comments.length }}</span>
                }
                @if (card.attachments.length) {
                  <span title="Anexos">📎 {{ card.attachments.length }}</span>
                }
                <span class="backlog-card__flags">
                  @if (card.locked) {
                    <span title="Cartão bloqueado" aria-label="Bloqueado">🔒</span>
                  }
                  @if (card.favorite) {
                    <span class="backlog-card__star" title="Favorito" aria-label="Favorito">★</span>
                  }
                  @if (card.assignee) {
                    <span class="backlog-card__avatar" [attr.title]="card.assignee">{{ initials(card.assignee) }}</span>
                  }
                </span>
              </span>
            </button>
          </li>
        } @empty {
          <li class="backlog__empty">Nenhuma atividade</li>
        }
      </ul>

      <button class="backlog__add" type="button" (click)="openNew(column.id)">+ Adicionar</button>
    </section>
  }
  @if (isAdmin()) {
    <app-add-column (add)="addColumn($event)" />
  }
</div>

<!-- Modal do cartão (o mesmo da página do setor) -->
<app-backlog-editor />
